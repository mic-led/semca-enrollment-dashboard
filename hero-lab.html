<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Lab — SEMCA Dashboard</title>
<!-- A sandbox for trying alternative hero (KPI header) designs against the real dashboard data.
     Loads the same dashboard-data.js the dashboard uses. Nothing here affects the main page. -->
<script>document.write('<script src="dashboard-data.js?v=' + Date.now() + '"><\/script>');</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --navy: #1e3a5f; --navy-dark: #152a46; --navy-light: #2e5082; --blue: #3b82f6; --blue-light: #93c5fd;
  --orange: #f4a261; --green: #2a9d8f; --red: #e63946; --radius: 12px;
  --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #e2e8f0; --text-muted: #94a3b8;
}
body.light { --bg: #f0f4f8; --card: #ffffff; --border: #e2e8f0; --text: #1a202c; --text-muted: #64748b; }
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 24px; }
.lab-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 18px; }
.lab-bar h2 { font-size: 1rem; margin: 0 12px 0 0; }
.lab-bar .grp { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.lab-bar .grp button { background: transparent; border: none; color: var(--text-muted); padding: 7px 12px; font: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
.lab-bar .grp button.active { background: var(--navy); color: #fff; }
.lab-note { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 14px; max-width: 900px; }
.lab-stage { max-width: 1160px; }
.lab-foot { font-size: 0.72rem; color: var(--text-muted); margin-top: 16px; }
.lab-foot a { color: var(--blue-light); }

/* ── Baseline hero (copied from the dashboard) ── */
.hero { background:
    radial-gradient(ellipse 70% 110% at 108% -5%, rgba(59,130,246,0.28) 0%, transparent 55%),
    radial-gradient(ellipse 55% 75% at -6% 112%, rgba(213,94,0,0.22) 0%, transparent 52%),
    linear-gradient(135deg, var(--navy-dark) 0%, var(--navy-light) 100%);
  border-radius: var(--radius); padding: 36px 40px; position: relative; overflow: hidden; }
.hero::before { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background-image: radial-gradient(rgba(148,197,255,0.12) 1px, transparent 1px); background-size: 26px 26px; }
.hero-label { color: var(--orange); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; position: relative; z-index: 1; }
.hero h1 { color: white; font-size: 1.9rem; font-weight: 800; letter-spacing: -0.5px; line-height: 1.2; position: relative; z-index: 1; margin: 0; }
.hero-sub { color: #94a3b8; font-size: 0.9rem; margin-top: 6px; position: relative; z-index: 1; }
.hero-pills { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; position: relative; z-index: 2; }
.hero-year-pill { padding: 6px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer; border: 1.5px solid rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); transition: all 0.18s; user-select: none; display: inline-flex; align-items: center; gap: 7px; font-family: inherit; }
.hero-year-pill:hover { background: rgba(255,255,255,0.18); color: white; border-color: rgba(255,255,255,0.6); }
.hero-year-pill.active { background: white; color: var(--navy-dark); border-color: white; font-weight: 700; }
.hero-year-pill.in-session { background: rgba(37,99,235,0.2); border-color: rgba(96,165,250,0.75); color: #dbeafe; }
.hero-year-pill.in-session.active { background: #2563eb; border-color: #93c5fd; color: white; }
.hero-year-pill.projected { border-style: dashed; border-color: rgba(167,139,250,0.7); color: #ddd6fe; background: rgba(139,92,246,0.12); }
.hero-year-pill.projected.active { background: #7c3aed; border-color: #c4b5fd; border-style: solid; color: white; }
.hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 28px; position: relative; z-index: 1; }
.hero-stat { background: rgba(0,0,0,0.22); border-radius: 12px; padding: 16px 20px; border: 1px solid rgba(255,255,255,0.1);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 4px 20px rgba(0,0,0,0.25); position: relative; overflow: hidden; transition: transform 0.22s ease, box-shadow 0.22s ease; }
.hero-stat::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--orange), transparent); opacity: 0.7; }
.hero-stat:hover { transform: translateY(-3px); }
.hs-label { color: #94a3b8; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.hs-label i { display: none; opacity: 0.8; }
.hero[data-variant="C"] .hs-label i, .hero[data-variant="D"] .hs-label i { display: inline; }
.hs-num { color: white; font-size: 2rem; font-weight: 800; letter-spacing: -1px; line-height: 1; text-shadow: 0 0 20px rgba(255,255,255,0.15); }
.hs-change { margin-top: 6px; font-size: 0.78rem; font-weight: 600; }
.hs-change.pos { color: #4ade80; } .hs-change.neg { color: #f87171; } .hs-change.neutral { color: #94a3b8; }
.hero-stats.projected .hero-stat { border-style: dashed; border-color: rgba(167,139,250,0.35); }
.hero-stats.projected .hero-stat::before { background: linear-gradient(90deg, transparent, #a78bfa, transparent); }
.hero-stats.in-session .hero-stat::before { background: linear-gradient(90deg, transparent, #60a5fa, transparent); }

/* ── Variant B: compact strip ── */
.hero[data-variant="B"] { padding: 20px 28px; }
.hero[data-variant="B"] .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; position: relative; z-index: 2; }
.hero[data-variant="B"] h1 { font-size: 1.3rem; }
.hero[data-variant="B"] .hero-sub { display: none; }
.hero[data-variant="B"] .hero-pills { margin-top: 0; }
.hero[data-variant="B"] .hero-stats { grid-template-columns: repeat(4, 1fr); gap: 0; margin-top: 18px; border-top: 1px solid rgba(255,255,255,0.12); }
.hero[data-variant="B"] .hero-stat { background: transparent; border: none; box-shadow: none; border-radius: 0; padding: 14px 20px 4px; border-right: 1px solid rgba(255,255,255,0.12); }
.hero[data-variant="B"] .hero-stat:last-child { border-right: none; }
.hero[data-variant="B"] .hero-stat::before { display: none; }
.hero[data-variant="B"] .hero-stat:hover { transform: none; }
.hero[data-variant="B"] .hs-num { font-size: 1.7rem; }

/* ── Variant C: headline number ── */
.hero[data-variant="C"] .hero-body { display: grid; grid-template-columns: 1.2fr 1fr; gap: 28px; align-items: center; margin-top: 22px; position: relative; z-index: 1; }
.hero[data-variant="C"] .hero-stats { grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 0; }
.hero[data-variant="C"] .hero-stat-apps { display: none; }
.hero[data-variant="C"] .hero-stat-growth { grid-column: 1 / -1; }
.hero[data-variant="C"] .headline .hs-label { font-size: 0.8rem; letter-spacing: 1.2px; }
.hero[data-variant="C"] .headline .hs-num { font-size: 5.2rem; letter-spacing: -3px; background: linear-gradient(120deg, #fff 30%, #93c5fd); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; text-shadow: none; }
.hero[data-variant="C"] .headline .hs-change { font-size: 1rem; margin-top: 10px; }
.hero[data-variant="C"] .hero-stat { padding: 14px 16px; }
.hero[data-variant="C"] .hs-num { font-size: 1.6rem; }

/* ── Variant D: accent cards ── */
.hero[data-variant="D"] .hero-stat { background: rgba(255,255,255,0.06); border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); padding: 18px 20px 18px 24px; }
.hero[data-variant="D"] .hero-stat::before { top: 12px; bottom: 12px; left: 0; right: auto; width: 4px; height: auto; border-radius: 4px; opacity: 1; }
.hero[data-variant="D"] .hero-stat-apps::before   { background: #3b82f6; }
.hero[data-variant="D"] .hero-stat-new::before    { background: #34d399; }
.hero[data-variant="D"] .hero-stat-ret::before    { background: #f4a261; }
.hero[data-variant="D"] .hero-stat-growth::before { background: #a78bfa; }
.hero[data-variant="D"] .hs-num { font-size: 2.4rem; }

/* ── Variant E: minimal flat ── */
.hero[data-variant="E"] { background: var(--navy-dark); border-radius: 10px; padding: 28px 32px; }
.hero[data-variant="E"]::before { display: none; }
.hero[data-variant="E"] .hero-label { color: #93c5fd; }
.hero[data-variant="E"] .hero-pills { gap: 0; border-bottom: 1px solid rgba(255,255,255,0.15); margin-top: 20px; }
.hero[data-variant="E"] .hero-year-pill { border: none; border-radius: 0; background: transparent; padding: 8px 14px; color: rgba(255,255,255,0.6); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.hero[data-variant="E"] .hero-year-pill.active { background: transparent; color: white; border-bottom-color: #93c5fd; }
.hero[data-variant="E"] .hero-year-pill.projected { border-bottom-style: dashed; }
.hero[data-variant="E"] .hero-year-pill.projected.active { border-bottom-color: #a78bfa; }
.hero[data-variant="E"] .hero-stats { gap: 40px; margin-top: 22px; }
.hero[data-variant="E"] .hero-stat { background: transparent; border: none; box-shadow: none; padding: 0; }
.hero[data-variant="E"] .hero-stat::before { display: none; }
.hero[data-variant="E"] .hero-stat:hover { transform: none; }
.hero[data-variant="E"] .hs-num { font-size: 2.6rem; text-shadow: none; font-variant-numeric: tabular-nums; }
/* Responsive rules key off the preview stage width (container query) so the Tablet/Phone buttons work without resizing the window */
.lab-stage { container-type: inline-size; }
@container (max-width: 900px) {
  .hero { padding: 24px 16px; }
  .hero h1 { font-size: 1.4rem; }
  .hero-stats, .hero[data-variant="B"] .hero-stats { grid-template-columns: 1fr 1fr; gap: 10px; }
  .hero[data-variant="B"] .hero-stat:nth-child(2) { border-right: none; }
  .hero[data-variant="C"] .hero-body { grid-template-columns: 1fr; }
  .hero[data-variant="C"] .headline .hs-num { font-size: 3.6rem; }
  .hero[data-variant="E"] .hero-stats { gap: 18px; }
  .hs-num { font-size: 1.5rem !important; letter-spacing: -0.5px; }
  .hero[data-variant="C"] .headline .hs-num { font-size: 3.6rem !important; }
  .hs-label { font-size: 0.65rem; } .hs-change { font-size: 0.7rem; } .hero-sub { font-size: 0.8rem; }
}
</style>
</head>
<body>
<div class="lab-bar">
  <h2><i class="fa fa-flask" style="color:var(--orange);margin-right:6px;"></i>Hero Lab</h2>
  <div class="grp" id="variants"></div>
  <div class="grp" id="themes"><button data-theme="dark" class="active">Dark</button><button data-theme="light">Light</button></div>
  <div class="grp" id="widths"><button data-w="1160" class="active">Desktop</button><button data-w="820">Tablet</button><button data-w="390">Phone</button></div>
</div>
<p class="lab-note" id="note"></p>
<div class="lab-stage" id="stage">
  <div class="hero" id="hero" data-variant="A">
    <div class="hero-top">
      <div>
        <div class="hero-label">Enrollment Trend Analysis &bull; <span id="today"></span></div>
        <h1>SEMCA Enrollment Dashboard</h1>
        <div class="hero-sub">Historical data analysis covering <span id="range"></span> &bull; Applications, Registrations, Trends &amp; Insights</div>
      </div>
      <div class="hero-pills" id="pills"></div>
    </div>
    <div class="hero-body">
      <div class="headline" id="headline" style="display:none;">
        <div class="hs-label" id="hl-label"></div>
        <div class="hs-num" id="hl-num"></div>
        <div class="hs-change" id="hl-change"></div>
      </div>
      <div class="hero-stats" id="stats">
        <div class="hero-stat hero-stat-apps"><div class="hs-label"><i class="fa fa-file-lines"></i><span id="l-apps"></span></div><div class="hs-num" id="n-apps"></div><div class="hs-change" id="c-apps"></div></div>
        <div class="hero-stat hero-stat-new"><div class="hs-label"><i class="fa fa-user-plus"></i><span id="l-new"></span></div><div class="hs-num" id="n-new"></div><div class="hs-change" id="c-new"></div></div>
        <div class="hero-stat hero-stat-ret"><div class="hs-label"><i class="fa fa-rotate-right"></i><span id="l-ret"></span></div><div class="hs-num" id="n-ret"></div><div class="hs-change" id="c-ret"></div></div>
        <div class="hero-stat hero-stat-growth"><div class="hs-label"><i class="fa fa-arrow-trend-up"></i><span id="l-growth"></span></div><div class="hs-num" id="n-growth"></div><div class="hs-change neutral" id="c-growth"></div></div>
      </div>
    </div>
  </div>
</div>
<p class="lab-foot">Live numbers from <code>dashboard-data.js</code>. Variants only change CSS/layout; the main dashboard is untouched. <a href="SEMCA_Enrollment_Analysis.html">Back to the dashboard</a>.</p>

<script>
(function() {
  const VARIANTS = {
    A: ["Classic (current)", "The hero as it is today: gradient panel, four glass tiles, pills above."],
    B: ["Compact strip", "Title and year pills on one line, KPIs as a single divided stat row. About 40% shorter."],
    C: ["Headline number", "Applications as one big gradient figure; the other KPIs stacked beside it as small tiles."],
    D: ["Accent cards", "Each KPI gets its own colour bar and icon (blue apps, green enrollments, orange returning, violet growth)."],
    E: ["Minimal flat", "No gradients or textures; underline-tab year selector; bare numbers with generous spacing."],
  };
  const $ = id => document.getElementById(id);
  const hero = $("hero"), pillsEl = $("pills");
  const hasData = typeof YEARS !== "undefined";
  const years = hasData ? YEARS : ["Fall 2022", "Fall 2023", "Fall 2024", "Fall 2025", "Fall 2026"];
  const apps = hasData ? APP_TOTALS : [276, 386, 450, 504, 610], newreg = hasData ? NEW_REG : [226, 258, 323, 329, 410], ret = hasData ? RET_REG : [313, 396, 460, 533, 564];
  const activeIdx = hasData ? ACTIVE_IDX : years.length - 1;
  const hasNext = hasData && typeof NEXT_PROJ !== "undefined" && NEXT_PROJ && NEXT_PROJ.apps != null && ACTIVE_COMPLETE;
  let sel = activeIdx;
  $("today").textContent = new Date().toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });
  $("range").textContent = years[0] + " through " + years[years.length - 1];

  function pct(o, n) { if (!o) return null; const v = ((n - o) / o * 100).toFixed(1); return (v >= 0 ? "+" : "") + v + "%"; }
  function setChange(id, val, prev, prevLabel) {
    const el = $(id), p = pct(prev, val);
    if (p === null) { el.className = "hs-change neutral"; el.textContent = "Earliest year on record"; return; }
    el.className = "hs-change " + (parseFloat(p) >= 0 ? "pos" : "neg");
    el.innerHTML = '<i class="fa fa-arrow-trend-' + (parseFloat(p) >= 0 ? "up" : "down") + '"></i> ' + p + " vs " + prevLabel.replace("Fall ", "");
  }
  function render() {
    const isNext = hasNext && sel === years.length;
    const label = isNext ? NEXT_YEAR_LABEL : years[sel];
    const a = isNext ? NEXT_PROJ.apps : apps[sel], n = isNext ? NEXT_PROJ.newreg : newreg[sel], r = isNext ? NEXT_PROJ.returning : ret[sel];
    const prev = sel > 0 ? sel - 1 : null;
    const sfx = isNext ? " (projected)" : "";
    $("l-apps").textContent = label + " Applications" + sfx; $("n-apps").textContent = a.toLocaleString(); setChange("c-apps", a, prev !== null ? apps[prev] : null, prev !== null ? years[prev] : "");
    $("l-new").textContent = label + " New Enrollments" + sfx; $("n-new").textContent = n.toLocaleString(); setChange("c-new", n, prev !== null ? newreg[prev] : null, prev !== null ? years[prev] : "");
    $("l-ret").textContent = "Returning Students (F" + label.slice(-2) + ")" + sfx; $("n-ret").textContent = r.toLocaleString(); setChange("c-ret", r, prev !== null ? ret[prev] : null, prev !== null ? years[prev] : "");
    const g = apps[0] ? ((a - apps[0]) / apps[0] * 100).toFixed(0) : 0;
    $("l-growth").textContent = sel + "-Year App Growth"; $("n-growth").textContent = (g >= 0 ? "+" : "") + g + "%"; $("c-growth").textContent = apps[0].toLocaleString() + " (" + years[0].slice(-4) + ") → " + a.toLocaleString() + " (" + label.slice(-4) + ")";
    $("stats").classList.toggle("projected", isNext);
    $("stats").classList.toggle("in-session", !isNext && sel === activeIdx);
    // headline (variant C)
    $("hl-label").textContent = label + " Applications" + sfx; $("hl-num").textContent = a.toLocaleString(); $("hl-change").className = $("c-apps").className; $("hl-change").innerHTML = $("c-apps").innerHTML;
    pillsEl.querySelectorAll(".hero-year-pill").forEach(p => p.classList.toggle("active", parseInt(p.dataset.idx) === sel));
  }
  // pills
  pillsEl.innerHTML = years.map((y, i) => `<button class="hero-year-pill${i === activeIdx ? " in-session" : ""}" data-idx="${i}">${y}</button>`).join("")
    + (hasNext ? `<button class="hero-year-pill projected" data-idx="${years.length}"><i class="fa fa-chart-line" style="font-size:0.7rem;"></i>${NEXT_YEAR_LABEL} <span style="font-size:0.65rem;opacity:0.75;">proj.</span></button>` : "");
  pillsEl.addEventListener("click", e => { const b = e.target.closest(".hero-year-pill"); if (!b) return; sel = parseInt(b.dataset.idx); render(); });
  // variant switcher
  const vEl = $("variants");
  vEl.innerHTML = Object.keys(VARIANTS).map(k => `<button data-v="${k}"${k === "A" ? ' class="active"' : ""}>${k} · ${VARIANTS[k][0]}</button>`).join("");
  function setVariant(v) {
    hero.dataset.variant = v; $("note").textContent = VARIANTS[v][1];
    $("headline").style.display = v === "C" ? "" : "none";
    vEl.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.v === v));
    try { localStorage.setItem("hero_lab_variant", v); } catch (_) {}
  }
  vEl.addEventListener("click", e => { const b = e.target.closest("button"); if (b) setVariant(b.dataset.v); });
  $("themes").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; document.body.classList.toggle("light", b.dataset.theme === "light"); $("themes").querySelectorAll("button").forEach(x => x.classList.toggle("active", x === b)); });
  $("widths").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; $("stage").style.maxWidth = b.dataset.w + "px"; $("widths").querySelectorAll("button").forEach(x => x.classList.toggle("active", x === b)); });
  let v = "A"; try { v = localStorage.getItem("hero_lab_variant") || "A"; } catch (_) {}
  setVariant(VARIANTS[v] ? v : "A"); render();
})();
</script>
</body>
</html>
